import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def generatedAppName = System.getenv('APP_NAME') ?: 'פנקס הכנסות'
def generatedAppUrl = System.getenv('APP_URL') ?: 'https://script.google.com/macros/s/AKfycbyoJeN1G2EuGczP88itz2r2OKXH5GWL45c3ICe9L2kOHG2rNIFYJ98aRx0UPyZEIHyKxA/exec'
def generatedZoomText = System.getenv('APP_ZOOM') ?: '90'
def generatedVersionText = System.getenv('APP_VERSION_CODE') ?: '1'
def generatedZoom = 90
def generatedVersionCode = 1
try {
    generatedZoom = Integer.parseInt(generatedZoomText)
} catch (Exception ignored) {
    generatedZoom = 90
}
try {
    generatedVersionCode = Integer.parseInt(generatedVersionText)
} catch (Exception ignored) {
    generatedVersionCode = 1
}
generatedZoom = Math.max(50, Math.min(150, generatedZoom))
generatedVersionCode = Math.max(1, generatedVersionCode)
def escapedUrl = generatedAppUrl.replace('\\', '\\\\').replace('"', '\\"')

// Every different URL gets its own stable Android package id, so generated apps can
// live side-by-side. Rebuilding the same URL keeps the same package id for updates.
def appIdDigest = MessageDigest.getInstance('SHA-256')
        .digest(generatedAppUrl.getBytes('UTF-8'))
        .encodeHex()
        .toString()
def generatedApplicationId = 'com.militzer.generated.a' + appIdDigest.substring(0, 16)

def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keyAliasValue = System.getenv('ANDROID_KEY_ALIAS')
def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD')
def signingReady = keystorePath && keystorePassword && keyAliasValue && keyPasswordValue

android {
    namespace 'com.militzer.pincasincome'
    compileSdk 35

    defaultConfig {
        applicationId generatedApplicationId
        minSdk 26
        targetSdk 35
        versionCode generatedVersionCode
        versionName '1.0.' + generatedVersionCode

        manifestPlaceholders = [appLabel: generatedAppName]
        buildConfigField 'String', 'START_URL', '"' + escapedUrl + '"'
        buildConfigField 'int', 'ZOOM_PERCENT', generatedZoom.toString()
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            if (signingReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
