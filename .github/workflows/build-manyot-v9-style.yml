name: Build Manyot V9 Style

on:
  workflow_dispatch:
  push:
    paths:
      - 'manyot_icon_settings_v8.py'
      - 'manyot_icon_style_v9.py'
      - 'btl_icon_settings_v2.py'
      - 'btl_icon_options_v6.py'
      - 'btl_icon_scale_v7.py'
      - 'hadashot_transform.py'
      - 'manyot-v6.patch'
      - '.github/workflows/build-manyot-v9-style.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild known-good Manyot base
        run: |
          cat manyot-android-parts/part00 \
              manyot-android-parts/part01 \
              manyot-android-parts/part02 \
              manyot-android-parts/part03 \
              manyot-android-parts/part04 \
              manyot-android-parts/part05 \
              manyot-android-parts/part06 \
              manyot-android-parts/part07 \
              manyot-android-parts/part08 > manyot-base.zip
          unzip -t manyot-base.zip
          rm -rf hadashot-build
          mkdir hadashot-build
          unzip -q manyot-base.zip -d hadashot-build

      - name: Reapply approved V5 changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, textwrap, shutil
          wf = Path('.github/workflows/build-manyot-apk.yml').read_text(encoding='utf-8')
          start = wf.index('- name: Apply Manyot V5 update')
          tail = wf[start:]
          m = re.search(r"run: \|\n(?P<body>.*?)(?=\n\s{6}- name: )", tail, re.S)
          if not m: raise SystemExit('Could not locate V5 update step')
          body = textwrap.dedent(m.group('body'))
          m2 = re.search(r"python <<'PY'\n(.*?)\nPY", body, re.S)
          if not m2: raise SystemExit('Could not locate V5 Python patch')
          shutil.rmtree('manyot-build', ignore_errors=True)
          shutil.copytree('hadashot-build','manyot-build')
          exec(compile(m2.group(1), '<v5-update>', 'exec'), {})
          shutil.rmtree('hadashot-build', ignore_errors=True)
          shutil.move('manyot-build','hadashot-build')
          PY

      - name: Apply Manyot V6 app support
        shell: bash
        run: |
          rm -rf manyot-build
          cp -a hadashot-build manyot-build
          patch -p1 -d manyot-build < manyot-v6.patch || true
          python <<'PY'
          from pathlib import Path
          import re
          root=Path('manyot-build/manyot_android_v1')
          p=root/'app/src/main/assets/index.html'
          t=p.read_text(encoding='utf-8')
          t=re.sub(r'<title>מניות - גרסה \d+</title>','<title>מניות - גרסה 6</title>',t)
          t=re.sub(r"const APP_VERSION='\d+';","const APP_VERSION='6';",t)
          p.write_text(t,encoding='utf-8')
          g=root/'app/build.gradle'
          s=g.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 3',s)
          s=re.sub(r"versionName\s+'[^']+'","versionName '3.0'",s)
          g.write_text(s,encoding='utf-8')
          PY
          rm -rf hadashot-build
          mv manyot-build hadashot-build

      - name: Save Manyot seed before full picker conversion
        run: cp hadashot-build/manyot_android_v1/app/src/main/assets/index.html /tmp/manyot-v6-index.html

      - name: Apply proven Tikiot3-style full app picker
        run: python hadashot_transform.py

      - name: Restore Manyot identity and data seed as V7 base
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          root=Path('hadashot-build/manyot_android_v1')

          g=root/'app/build.gradle'
          s=g.read_text(encoding='utf-8')
          s=re.sub(r"applicationId\s+'[^']+'", "applicationId 'com.militzerjoseph.manyot'", s)
          s=re.sub(r'versionCode\s+\d+', 'versionCode 4', s)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '4.0'", s)
          g.write_text(s,encoding='utf-8')

          strings=root/'app/src/main/res/values/strings.xml'
          st=strings.read_text(encoding='utf-8').replace('חדשות','מניות')
          strings.write_text(st,encoding='utf-8')

          p=root/'app/src/main/assets/index.html'
          t=p.read_text(encoding='utf-8')
          t=t.replace('חדשות','מניות')
          t=t.replace("const STORAGE_KEY='HADASHOT_STANDALONE_V1';","const STORAGE_KEY='MANYOT_STANDALONE_V1';")
          t=re.sub(r"const STOCKS_ID='[^']+';","const STOCKS_ID='f_stocks';",t)
          t=re.sub(r'<title>מניות - גרסה \d+</title>','<title>מניות - גרסה 7</title>',t)
          t=re.sub(r"const APP_VERSION='\d+';","const APP_VERSION='7';",t)

          original=Path('/tmp/manyot-v6-index.html').read_text(encoding='utf-8')
          m=re.search(r'const SEED=.*?;\n\n',original,re.S)
          if not m: raise SystemExit('Original Manyot seed not found')
          t=re.sub(r'const SEED=.*?;\n\n',m.group(0),t,count=1,flags=re.S)
          p.write_text(t,encoding='utf-8')

          j=root/'app/src/main/java/com/militzerjoseph/manyot/MainActivity.java'
          js=j.read_text(encoding='utf-8').replace('גיבוי_חדשות.json','גיבוי_מניות.json')
          j.write_text(js,encoding='utf-8')
          PY

      - name: Apply Manyot V8 settings base
        run: python manyot_icon_settings_v8.py

      - name: Apply Manyot V9 red-black icon designer
        run: python manyot_icon_style_v9.py

      - name: Verify Manyot V9 source
        shell: bash
        run: |
          ROOT=hadashot-build/manyot_android_v1
          grep -q "applicationId 'com.militzerjoseph.manyot'" "$ROOT/app/build.gradle"
          grep -q "versionCode 6" "$ROOT/app/build.gradle"
          grep -q "const APP_NAME='מניות'" "$ROOT/app/src/main/assets/index.html"
          grep -q "const APP_VERSION='9'" "$ROOT/app/src/main/assets/index.html"
          grep -q "MANYOT_STANDALONE_V1" "$ROOT/app/src/main/assets/index.html"
          grep -q "Icon_black_red_white_normal_bold_v9" "$ROOT/app/src/main/AndroidManifest.xml"
          grep -q 'manyot_launcher_icon_v9' "$ROOT/app/src/main/java/com/militzerjoseph/manyot/MainActivity.java"
          grep -q 'צבע הפס העליון' "$ROOT/app/src/main/assets/index.html"
          grep -q 'עובי הכיתוב' "$ROOT/app/src/main/assets/index.html"
          test "$(find "$ROOT/app/src/main/res/drawable-nodpi" -name 'ic_manyot_*.png' | wc -l)" -eq 360
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('hadashot-build/manyot_android_v1/app/src/main/assets/index.html').read_text(encoding='utf-8')
          js=re.search(r'<script>(.*)</script>',t,re.S).group(1)
          Path('/tmp/manyot-v9.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/manyot-v9.js

      - name: Build unsigned release APK
        run: gradle -p hadashot-build/manyot_android_v1 assembleRelease

      - name: Prepare APK
        run: cp hadashot-build/manyot_android_v1/app/build/outputs/apk/release/app-release-unsigned.apk Manyot_V9_unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manyot-v9-unsigned-apk
          path: Manyot_V9_unsigned.apk
          if-no-files-found: error

      - name: Prepare signer tools
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p signer-tools/lib
          cp "$BT/apksigner" signer-tools/
          cp "$BT/zipalign" signer-tools/
          cp "$BT/lib/apksigner.jar" signer-tools/lib/
          chmod +x signer-tools/apksigner signer-tools/zipalign

      - name: Upload signer tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signer-tools-35-manyot-v9
          path: signer-tools
          if-no-files-found: error
