name: Build Shortcut Builder Trial

on:
  push:
    branches:
      - shortcut-builder-trial
    paths:
      - 'shortcut-builder/**'
      - '.github/workflows/build-shortcut-builder.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: shortcut-builder
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shortcut-builder-trial-apk
          path: shortcut-builder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
