name: Build Shortcut Builder Trial

on:
  push:
    branches:
      - shortcut-builder-trial
    paths:
      - 'shortcut-builder/**'
      - '.github/workflows/build-shortcut-builder.yml'
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Name shown under the app icon'
        required: true
        default: 'פנקס הכנסות'
      app_url:
        description: 'Web address loaded by the wrapper'
        required: true
        default: 'https://script.google.com/macros/s/AKfycbyoJeN1G2EuGczP88itz2r2OKXH5GWL45c3ICe9L2kOHG2rNIFYJ98aRx0UPyZEIHyKxA/exec'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ inputs.app_name || 'פנקס הכנסות' }}
      APP_URL: ${{ inputs.app_url || 'https://script.google.com/macros/s/AKfycbyoJeN1G2EuGczP88itz2r2OKXH5GWL45c3ICe9L2kOHG2rNIFYJ98aRx0UPyZEIHyKxA/exec' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        working-directory: shortcut-builder
        run: gradle :app:assembleDebug :wrapper:assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: shortcut-builder-trial-apks
          path: |
            shortcut-builder/app/build/outputs/apk/debug/app-debug.apk
            shortcut-builder/wrapper/build/outputs/apk/debug/wrapper-debug.apk
          if-no-files-found: error

      - name: Publish trial output APK
        shell: bash
        run: |
          mkdir -p /tmp/trial-output/output
          cp shortcut-builder/app/build/outputs/apk/debug/app-debug.apk /tmp/trial-output/output/shortcut-builder-trial.apk
          cp shortcut-builder/wrapper/build/outputs/apk/debug/wrapper-debug.apk /tmp/trial-output/output/pincas-income.apk
          cd /tmp/trial-output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b shortcut-builder-output
          git add output
          git commit -m "Publish shortcut builder trial APKs"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin shortcut-builder-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
