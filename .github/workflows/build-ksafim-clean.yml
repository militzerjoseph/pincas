name: Build Ksafim Clean APK

on:
  workflow_dispatch:
  push:
    branches: [ksafim-clean-build]
    paths:
      - '.github/workflows/build-ksafim-clean.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild known-good Manyot base
        run: |
          cat manyot-android-parts/part00 \
              manyot-android-parts/part01 \
              manyot-android-parts/part02 \
              manyot-android-parts/part03 \
              manyot-android-parts/part04 \
              manyot-android-parts/part05 \
              manyot-android-parts/part06 \
              manyot-android-parts/part07 \
              manyot-android-parts/part08 > manyot-base.zip
          unzip -t manyot-base.zip
          rm -rf btl-build
          mkdir btl-build
          unzip -q manyot-base.zip -d btl-build

      - name: Reapply approved V5 changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, textwrap, shutil
          wf = Path('.github/workflows/build-manyot-apk.yml').read_text(encoding='utf-8')
          start = wf.index('- name: Apply Manyot V5 update')
          tail = wf[start:]
          m = re.search(r"run: \|\n(?P<body>.*?)(?=\n\s{6}- name: )", tail, re.S)
          if not m: raise SystemExit('Could not locate V5 update step')
          body = textwrap.dedent(m.group('body'))
          m2 = re.search(r"python <<'PY'\n(.*?)\nPY", body, re.S)
          if not m2: raise SystemExit('Could not locate V5 Python patch')
          shutil.rmtree('manyot-build', ignore_errors=True)
          shutil.copytree('btl-build','manyot-build')
          exec(compile(m2.group(1), '<v5-update>', 'exec'), {})
          shutil.rmtree('btl-build', ignore_errors=True)
          shutil.move('manyot-build','btl-build')
          PY

      - name: Apply Manyot V6 app support
        shell: bash
        run: |
          rm -rf manyot-build
          cp -a btl-build manyot-build
          patch -p1 -d manyot-build < manyot-v6.patch || true
          python <<'PY'
          from pathlib import Path
          import re
          root=Path('manyot-build/manyot_android_v1')
          p=root/'app/src/main/assets/index.html'
          t=p.read_text(encoding='utf-8')
          t=re.sub(r'<title>מניות - גרסה \d+</title>','<title>מניות - גרסה 6</title>',t)
          t=re.sub(r"const APP_VERSION='\d+';","const APP_VERSION='6';",t)
          p.write_text(t,encoding='utf-8')
          g=root/'app/build.gradle'
          s=g.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 3',s)
          s=re.sub(r"versionName\s+'[^']+'","versionName '3.0'",s)
          g.write_text(s,encoding='utf-8')
          PY
          rm -rf btl-build
          mv manyot-build btl-build

      - name: Apply full Tikiot3-style app picker
        shell: bash
        run: |
          rm -rf hadashot-build
          cp -a btl-build hadashot-build
          python hadashot_transform.py
          rm -rf btl-build
          mv hadashot-build btl-build

      - name: Transform to BTL V1 base
        run: python btl_transform.py

      - name: Add launcher icon settings base
        run: python btl_icon_settings_v2.py

      - name: Apply approved position base
        run: python btl_icon_size_v4.py

      - name: Add V6 icon options
        run: python btl_icon_options_v6.py

      - name: Apply V7 size and position
        run: python btl_icon_scale_v7.py

      - name: Apply BTL V8 modern icon designer
        run: python btl_icon_style_v8.py

      - name: Transform BTL V8 to standalone Ksafim
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, json
          root=Path('btl-build/manyot_android_v1')

          g=root/'app/build.gradle'
          s=g.read_text(encoding='utf-8')
          s=re.sub(r"applicationId\s+'[^']+'", "applicationId 'com.militzerjoseph.ksafimcard'", s)
          s=re.sub(r'versionCode\s+\d+', 'versionCode 1', s)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '1.0'", s)
          g.write_text(s,encoding='utf-8')

          strings=root/'app/src/main/res/values/strings.xml'
          st=strings.read_text(encoding='utf-8')
          st=st.replace('ביטוח לאומי','כספים').replace('מניות','כספים').replace('חדשות','כספים')
          strings.write_text(st,encoding='utf-8')

          p=root/'app/src/main/assets/index.html'
          t=p.read_text(encoding='utf-8')
          t=re.sub(r'<title>[^<]+</title>','<title>כספים - גרסה 1</title>',t,count=1)
          t=re.sub(r"const APP_VERSION='\d+';","const APP_VERSION='1';",t)
          t=re.sub(r"const APP_NAME='[^']+';","const APP_NAME='כספים';",t)
          t=re.sub(r"const STOCKS_ID='[^']+';","const STOCKS_ID='f_ksafim';",t)
          t=re.sub(r"const STORAGE_KEY='[^']+';","const STORAGE_KEY='KSAFIM_STANDALONE_V1';",t)

          seed={
            'folders':[{'id':'f_ksafim','name':'כספים','color':'#FFD86E','icon':'📁','createdAt':1}],
            'links':[
              {'id':'ks_001','folderId':'f_ksafim','title':'1-פנקס הכנסות והוצאות','url':'','shortcutType':'app','packageName':'com.example.pincaswebapk','appIcon':'','tag':'','createdAt':1,'updatedAt':1},
              {'id':'ks_002','folderId':'f_ksafim','title':'2-פנקס הוצאות','url':'','shortcutType':'app','packageName':'com.example.pincashybrid','appIcon':'','tag':'','createdAt':2,'updatedAt':2},
              {'id':'ks_003','folderId':'f_ksafim','title':'3-מחשבון הכנסה חודשית','url':'','shortcutType':'app','packageName':'com.monthlyincome.calculator.debug','appIcon':'','tag':'','createdAt':3,'updatedAt':3}
            ]
          }
          seedline='const SEED='+json.dumps(seed,ensure_ascii=False,separators=(',',':'))+';'
          t=re.sub(r'const SEED=.*?;\n\n',seedline+'\n\n',t,count=1,flags=re.S)

          for old in ['ביטוח לאומי','מניות','חדשות']:
              t=t.replace('גיבוי_'+old+'_','גיבוי_כספים_').replace('גיבוי_'+old+'.json','גיבוי_כספים.json')
              t=t.replace("payload={app:'"+old+"'","payload={app:'כספים'")
              t=t.replace("if(obj.app==='"+old+"')","if(obj.app==='כספים')")
              t=t.replace("includes('"+old+"')","includes('כספים')")
              t=t.replace('גיבוי של „'+old+'”','גיבוי של „כספים”')
              t=t.replace('תיקיית '+old,'תיקיית כספים')
              t=t.replace('הכותרת „'+old+'”','הכותרת „כספים”')
          p.write_text(t,encoding='utf-8')

          j=root/'app/src/main/java/com/militzerjoseph/manyot/MainActivity.java'
          js=j.read_text(encoding='utf-8')
          js=js.replace('גיבוי_ביטוח_לאומי.json','גיבוי_כספים.json').replace('גיבוי_מניות.json','גיבוי_כספים.json').replace('גיבוי_חדשות.json','גיבוי_כספים.json')
          j.write_text(js,encoding='utf-8')
          PY

      - name: Verify Ksafim source
        shell: bash
        run: |
          ROOT=btl-build/manyot_android_v1
          grep -q "applicationId 'com.militzerjoseph.ksafimcard'" "$ROOT/app/build.gradle"
          grep -q "const APP_NAME='כספים'" "$ROOT/app/src/main/assets/index.html"
          grep -q "KSAFIM_STANDALONE_V1" "$ROOT/app/src/main/assets/index.html"
          grep -q "com.example.pincaswebapk" "$ROOT/app/src/main/assets/index.html"
          grep -q "com.example.pincashybrid" "$ROOT/app/src/main/assets/index.html"
          grep -q "com.monthlyincome.calculator.debug" "$ROOT/app/src/main/assets/index.html"
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('btl-build/manyot_android_v1/app/src/main/assets/index.html').read_text(encoding='utf-8')
          js=re.search(r'<script>(.*)</script>',t,re.S).group(1)
          Path('/tmp/ksafim.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/ksafim.js

      - name: Build signed debug APK
        run: gradle -p btl-build/manyot_android_v1 assembleDebug

      - name: Prepare APK
        run: cp btl-build/manyot_android_v1/app/build/outputs/apk/debug/app-debug.apk Ksafim_Clean_Debug.apk

      - name: Verify APK signature and package
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose Ksafim_Clean_Debug.apk
          "$BT/aapt" dump badging Ksafim_Clean_Debug.apk | head -5
          "$BT/zipalign" -c -P 16 -v 4 Ksafim_Clean_Debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ksafim-clean-installable-apk
          path: Ksafim_Clean_Debug.apk
          if-no-files-found: error
