name: Build Pincas Work
on:
  push:
    branches: [pincas-work-rebuild]
    paths:
      - 'pincas-work/**'
      - '.github/workflows/build-pincas-work.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile release
        working-directory: pincas-work
        run: gradle --no-daemon assembleRelease
      - name: Collect unsigned APK and verification tools
        run: |
          mkdir -p pincas-output
          cp pincas-work/app/build/outputs/apk/release/app-release-unsigned.apk pincas-output/PincasWork_V1_unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" pincas-output/apksigner.jar
          cp pincas-work/app/build/outputs/apk/release/output-metadata.json pincas-output/
          git rev-parse HEAD > pincas-output/SOURCE_COMMIT.txt
          sha256sum pincas-output/*.apk > pincas-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PincasWork-V1-unsigned
          path: pincas-output/
          retention-days: 14
