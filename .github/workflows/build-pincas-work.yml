name: Build Pincas Work
on:
  push:
    branches: [pincas-work-rebuild]
    paths:
      - 'pincas-work/**'
      - '.github/workflows/build-pincas-work.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check backup compatibility
        working-directory: pincas-work
        run: node tests/restore-smoke.cjs
      - name: Install browser for phone layout checks
        working-directory: pincas-work
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Check phone screens and backup flow
        working-directory: pincas-work
        run: node tests/backup-ui.cjs
      - name: Check bank reconciliation and all report paths
        working-directory: pincas-work
        run: |
          node tests/bank-reconciliation.cjs
          node tests/bank-ui.cjs
      - name: Compile release
        working-directory: pincas-work
        run: gradle --no-daemon testReleaseUnitTest assembleRelease
      - name: Collect unsigned APK and verification tools
        run: |
          mkdir -p pincas-output
          cp pincas-work/app/build/outputs/apk/release/app-release-unsigned.apk pincas-output/PincasWork_V4_unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" pincas-output/apksigner.jar
          cp pincas-work/app/build/outputs/apk/release/output-metadata.json pincas-output/
          git rev-parse HEAD > pincas-output/SOURCE_COMMIT.txt
          sha256sum pincas-output/*.apk > pincas-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PincasWork-V4-unsigned
          path: pincas-output/
          retention-days: 14
