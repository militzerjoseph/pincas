name: Build News Work V101
on:
  workflow_dispatch:
  push:
    branches: [news-work-rebuild]
    paths:
      - 'news-work/**'
      - '.github/workflows/build-news-work.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare SDK and icons
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          python -m pip install pillow
          python news-work/prepare_icons.py
      - name: Check JavaScript and restore compatibility
        run: node news-work/verify.cjs
      - name: Build release APK
        run: gradle -p news-work assembleRelease
      - name: Collect APK and tools
        run: |
          mkdir -p news-output/tools
          cp news-work/app/build/outputs/apk/release/app-release-unsigned.apk news-output/News_Work_V101_unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" news-output/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" news-output/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" news-output/tools/
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging news-output/News_Work_V101_unsigned.apk | head -5
          cd news-output
          sha256sum News_Work_V101_unsigned.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: news-work-v101-build
          path: news-output/
          if-no-files-found: error
