name: Build Icon Cluster V1

on:
  push:
    branches:
      - icon-cluster-v1
    paths:
      - 'icon-cluster-v1/**'
      - '.github/workflows/build-icon-cluster-v1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply V2 UI settings
        run: python icon-cluster-v1/apply-v2-ui-settings.py

      - name: Apply V2.1 screen background choices
        run: python icon-cluster-v1/apply-v2-1-screen-bg.py

      - name: Apply V2.2 move mode
        run: python icon-cluster-v1/apply-v2-2-move-mode.py

      - name: Apply V2.3 backup and restore
        run: python icon-cluster-v1/apply-v2-3-backup-restore.py

      - name: Build unsigned release APK
        run: gradle -p icon-cluster-v1 :app:assembleRelease

      - name: Zipalign APK
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 \
            icon-cluster-v1/app/build/outputs/apk/release/app-release-unsigned.apk \
            IconCluster1_V1_aligned_unsigned.apk

      - name: Upload aligned unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: icon-cluster-v1-aligned-unsigned-apk
          path: IconCluster1_V1_aligned_unsigned.apk
          if-no-files-found: error

      - name: Prepare signer tools
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p signer-tools/lib
          cp "$BT/apksigner" signer-tools/
          cp "$BT/lib/apksigner.jar" signer-tools/lib/
          chmod +x signer-tools/apksigner

      - name: Upload signer tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35-icon-cluster-v1
          path: signer-tools
          if-no-files-found: error
