name: Build Banks Work V102
on:
  workflow_dispatch:
  push:
    branches: [banks-work-rebuild]
    paths:
      - 'banks-work/**'
      - '.github/workflows/build-banks-work.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare SDK and classic icons
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          python -m pip install pillow
          python banks-work/prepare_icons.py
      - name: Check JavaScript and restore compatibility
        run: node banks-work/verify.cjs
      - name: Build release APK
        run: gradle -p banks-work assembleRelease
      - name: Collect APK and tools
        run: |
          mkdir -p banks-output/tools
          cp banks-work/app/build/outputs/apk/release/app-release-unsigned.apk banks-output/Banks_Work_V102_unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" banks-output/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" banks-output/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" banks-output/tools/
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging banks-output/Banks_Work_V102_unsigned.apk | head -5
          cd banks-output
          sha256sum Banks_Work_V102_unsigned.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: banks-work-v102-build
          path: banks-output/
          if-no-files-found: error
