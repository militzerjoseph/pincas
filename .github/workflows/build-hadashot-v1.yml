name: Build Hadashot V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'hadashot_transform.py'
      - 'hadashot-icon-b64/**'
      - '.github/workflows/build-hadashot-v1.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild Manyot V6 source
        run: |
          cat manyot-v6-parts/part00 \
              manyot-v6-parts/part01 \
              manyot-v6-parts/part02 \
              manyot-v6-parts/part03 \
              manyot-v6-parts/part04 \
              manyot-v6-parts/part05 \
              manyot-v6-parts/part06 \
              manyot-v6-parts/part07 \
              manyot-v6-parts/part08 > manyot-v6-source.zip
          unzip -t manyot-v6-source.zip
          rm -rf hadashot-build
          mkdir hadashot-build
          unzip -q manyot-v6-source.zip -d hadashot-build

      - name: Transform to Hadashot V1
        run: python hadashot_transform.py

      - name: Install approved Hadashot icon
        shell: bash
        run: |
          cat hadashot-icon-b64/00 hadashot-icon-b64/01 hadashot-icon-b64/02 | base64 -d > hadashot-icon.webp
          file hadashot-icon.webp
          cp hadashot-icon.webp hadashot-build/manyot_android_v1/app/src/main/res/drawable-nodpi/ic_launcher.webp

      - name: Verify Hadashot source
        shell: bash
        run: |
          grep -q "applicationId 'com.militzerjoseph.hadashot'" hadashot-build/manyot_android_v1/app/build.gradle
          grep -q "const APP_NAME='חדשות'" hadashot-build/manyot_android_v1/app/src/main/assets/index.html
          grep -q "getLaunchableApps" hadashot-build/manyot_android_v1/app/src/main/java/com/militzerjoseph/manyot/MainActivity.java
          grep -q "openInstalledAppsPicker" hadashot-build/manyot_android_v1/app/src/main/assets/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('hadashot-build/manyot_android_v1/app/src/main/assets/index.html').read_text(encoding='utf-8')
          js=re.search(r'<script>(.*)</script>',t,re.S).group(1)
          Path('/tmp/hadashot.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/hadashot.js

      - name: Build unsigned release APK
        run: gradle -p hadashot-build/manyot_android_v1 assembleRelease

      - name: Prepare APK
        run: cp hadashot-build/manyot_android_v1/app/build/outputs/apk/release/app-release-unsigned.apk Hadashot_V1_unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hadashot-v1-unsigned-apk
          path: Hadashot_V1_unsigned.apk
          if-no-files-found: error
