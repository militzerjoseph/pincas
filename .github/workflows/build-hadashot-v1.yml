name: Build Hadashot V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'hadashot-v1-source.zip'
      - '.github/workflows/build-hadashot-v1.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source archive
        run: unzip -t hadashot-v1-source.zip

      - name: Unpack project
        run: |
          rm -rf hadashot-build
          mkdir hadashot-build
          unzip -q hadashot-v1-source.zip -d hadashot-build

      - name: Build unsigned release APK
        run: gradle -p hadashot-build/hadashot_android_v1 assembleRelease

      - name: Prepare APK
        run: cp hadashot-build/hadashot_android_v1/app/build/outputs/apk/release/app-release-unsigned.apk Hadashot_V1_unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hadashot-v1-unsigned-apk
          path: Hadashot_V1_unsigned.apk
          if-no-files-found: error
