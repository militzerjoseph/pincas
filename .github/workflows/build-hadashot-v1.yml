name: Build Hadashot V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'hadashot_transform.py'
      - 'hadashot-icon-b64/**'
      - '.github/workflows/build-hadashot-v1.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild known-good Manyot base
        run: |
          cat manyot-android-parts/part00 \
              manyot-android-parts/part01 \
              manyot-android-parts/part02 \
              manyot-android-parts/part03 \
              manyot-android-parts/part04 \
              manyot-android-parts/part05 \
              manyot-android-parts/part06 \
              manyot-android-parts/part07 \
              manyot-android-parts/part08 > manyot-base.zip
          unzip -t manyot-base.zip
          rm -rf hadashot-build
          mkdir hadashot-build
          unzip -q manyot-base.zip -d hadashot-build

      - name: Reapply approved V5 changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, textwrap
          wf = Path('.github/workflows/build-manyot-apk.yml').read_text(encoding='utf-8')
          start = wf.index('- name: Apply Manyot V5 update')
          tail = wf[start:]
          m = re.search(r"run: \|\n(?P<body>.*?)(?=\n\s{6}- name: )", tail, re.S)
          if not m:
              raise SystemExit('Could not locate V5 update step')
          body = textwrap.dedent(m.group('body'))
          m2 = re.search(r"python <<'PY'\n(.*?)\nPY", body, re.S)
          if not m2:
              raise SystemExit('Could not locate V5 Python patch')
          # V5 script expects manyot-build, so use that name temporarily.
          Path('manyot-build').mkdir(exist_ok=True)
          import shutil
          shutil.rmtree('manyot-build', ignore_errors=True)
          shutil.copytree('hadashot-build','manyot-build')
          exec(compile(m2.group(1), '<v5-update>', 'exec'), {})
          shutil.rmtree('hadashot-build', ignore_errors=True)
          shutil.move('manyot-build','hadashot-build')
          PY

      - name: Apply Manyot V6 app support
        shell: bash
        run: |
          rm -rf manyot-build
          cp -a hadashot-build manyot-build
          patch -p1 -d manyot-build < manyot-v6.patch || true
          python <<'PY'
          from pathlib import Path
          import re
          root=Path('manyot-build/manyot_android_v1')
          p=root/'app/src/main/assets/index.html'
          t=p.read_text(encoding='utf-8')
          t=re.sub(r'<title>מניות - גרסה \d+</title>','<title>מניות - גרסה 6</title>',t)
          t=re.sub(r"const APP_VERSION='\d+';","const APP_VERSION='6';",t)
          p.write_text(t,encoding='utf-8')
          g=root/'app/build.gradle'
          s=g.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 3',s)
          s=re.sub(r"versionName\s+'[^']+'","versionName '3.0'",s)
          g.write_text(s,encoding='utf-8')
          PY
          rm -rf hadashot-build
          mv manyot-build hadashot-build

      - name: Transform to Hadashot V1
        run: python hadashot_transform.py

      - name: Install approved Hadashot icon
        shell: bash
        run: |
          cat hadashot-icon-b64/00 hadashot-icon-b64/01 hadashot-icon-b64/02 | base64 -d > hadashot-icon.webp
          file hadashot-icon.webp
          cp hadashot-icon.webp hadashot-build/manyot_android_v1/app/src/main/res/drawable-nodpi/ic_launcher.webp

      - name: Verify Hadashot source
        shell: bash
        run: |
          grep -q "applicationId 'com.militzerjoseph.hadashot'" hadashot-build/manyot_android_v1/app/build.gradle
          grep -q "const APP_NAME='חדשות'" hadashot-build/manyot_android_v1/app/src/main/assets/index.html
          grep -q "getLaunchableApps" hadashot-build/manyot_android_v1/app/src/main/java/com/militzerjoseph/manyot/MainActivity.java
          grep -q "openInstalledAppsPicker" hadashot-build/manyot_android_v1/app/src/main/assets/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('hadashot-build/manyot_android_v1/app/src/main/assets/index.html').read_text(encoding='utf-8')
          js=re.search(r'<script>(.*)</script>',t,re.S).group(1)
          Path('/tmp/hadashot.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/hadashot.js

      - name: Build unsigned release APK
        run: gradle -p hadashot-build/manyot_android_v1 assembleRelease

      - name: Prepare APK
        run: cp hadashot-build/manyot_android_v1/app/build/outputs/apk/release/app-release-unsigned.apk Hadashot_V1_unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hadashot-v1-unsigned-apk
          path: Hadashot_V1_unsigned.apk
          if-no-files-found: error
