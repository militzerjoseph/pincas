name: Build Manyot APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'manyot-android-v1-source.zip'
      - '.github/workflows/build-manyot-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: |
          rm -rf manyot-build
          mkdir manyot-build
          unzip -q manyot-android-v1-source.zip -d manyot-build

      - name: Build debug APK
        run: gradle -p manyot-build/manyot_android_v1 assembleDebug

      - name: Prepare APK
        run: cp manyot-build/manyot_android_v1/app/build/outputs/apk/debug/app-debug.apk manyot-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manyot-v1-apk
          path: manyot-v1.apk
          if-no-files-found: error
