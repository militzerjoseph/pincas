name: Build BTL Work V101
on:
  workflow_dispatch:
  push:
    branches: [btl-work-rebuild]
    paths:
      - 'btl-work/**'
      - '.github/workflows/build-btl-work.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare SDK and icons
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          python -m pip install pillow
          python btl-work/prepare_icons.py
      - name: Check JavaScript and restore compatibility
        run: node btl-work/verify.cjs
      - name: Build release APK
        run: gradle -p btl-work assembleRelease
      - name: Collect APK and tools
        run: |
          mkdir -p btl-output/tools
          cp btl-work/app/build/outputs/apk/release/app-release-unsigned.apk btl-output/Btl_Work_V101_unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" btl-output/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" btl-output/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" btl-output/tools/
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging btl-output/Btl_Work_V101_unsigned.apk | head -5
          cd btl-output
          sha256sum Btl_Work_V101_unsigned.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: btl-work-v101-build
          path: btl-output/
          if-no-files-found: error
