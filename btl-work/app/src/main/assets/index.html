<!doctype html>
<html lang="he" dir="rtl">
<head>

<title>ב.לאומי — גרסה 101</title>
<style>
.field{background:#fff!important;border:1px solid #b3bdc9!important}.version{font-weight:400!important}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ui-page-bg,#f5f5f5);color:#111;font-family:Arial,"Noto Sans Hebrew",sans-serif}
body{-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
button{cursor:pointer}
.head{
  background:var(--ui-header-bg,#111111);color:var(--ui-header-text,#ffffff);padding:42px 20px 20px;
  display:flex;align-items:center;gap:16px;direction:rtl;
  position:sticky;top:0;z-index:5
}
.head-title{flex:1;min-width:0;text-align:right}
.head h1{margin:0;font-size:var(--ui-header-size,28px);font-weight:var(--ui-header-weight,700);line-height:1;text-align:right}
.version{font-size:var(--ui-version-size,14px);font-weight:var(--ui-version-weight,400);color:var(--ui-header-text,#ffffff);opacity:.72;margin-top:6px}
.icons{display:flex;align-items:center;gap:8px;direction:ltr}
.icons button{border:0;background:transparent;color:#fff;padding:0;line-height:1}
.addtop{font-size:27px;color:#ffd86e!important;display:flex;align-items:center;gap:2px;direction:ltr}
.plus-left{font-size:26px;line-height:1}
.symbol-right{font-size:25px;line-height:1}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px;direction:ltr}
.folder{
  touch-action:pan-y;-webkit-user-select:none;user-select:none;
  border:0;border-radius:20px;min-height:125px;padding:22px 14px 14px;
  box-shadow:0 3px 12px #0002;position:relative;text-align:right;overflow:hidden
}
.name{font-size:21px;font-weight:600;direction:rtl;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{position:absolute;left:14px;bottom:12px;font-size:20px;direction:ltr}
.icon{position:absolute;right:14px;bottom:4px;font-size:32px;line-height:1}

.tools{display:flex;justify-content:center;gap:10px;padding:4px 18px 24px}
.toolbtn{border:0;border-radius:14px;background:var(--ui-card-bg,#ffffff);padding:11px 18px;font-size:var(--ui-tool-size,17px);font-weight:var(--ui-tool-weight,400);box-shadow:0 2px 8px #0001}
.backup-date{text-align:center;color:#777;font-size:14px;padding:0 15px 16px}

.links{padding:12px 18px 42px}
.link{
  background:var(--ui-card-bg,#ffffff);touch-action:pan-y;-webkit-user-select:none;user-select:none;
  border-radius:14px;padding:13px;margin:9px 0;display:grid;
  grid-template-columns:50px 1fr;gap:12px;direction:ltr;
  box-shadow:0 2px 8px #0001;cursor:pointer
}
.li{font-size:26px;display:grid;place-items:center}
.link-globe{width:30px;height:30px;display:block}
.link-globe.website{color:#1976d2}
.link-globe.app{color:#f28c28}
.link-globe circle,.link-globe path{stroke:currentColor;fill:none;stroke-width:2}
.missing-mark{font-size:26px;line-height:1}
.lt{direction:rtl;text-align:right;min-width:0}
.lt b{font-size:var(--ui-shortcut-size,20px);font-weight:var(--ui-shortcut-weight,600);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt small{display:block;margin-top:5px;color:#555;font-size:var(--ui-url-size,13px);font-weight:var(--ui-url-weight,400);direction:ltr;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.missing{color:#999!important;direction:rtl!important;text-align:right!important}
.empty{padding:50px 20px;text-align:center;color:#777;font-size:19px}

.overlay{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:flex-end;z-index:30}
.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:82dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet h2{margin:2px 0 12px;font-size:24px;line-height:1.12}
.form-stack{display:grid;gap:8px}
.sticky-actions{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:#fff;padding-top:10px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));margin-top:8px}
.field{width:100%;padding:12px;border:2px solid #777;border-radius:14px;font-size:18px;margin:0}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.segment button{border:0;border-radius:12px;padding:11px;background:#ddd;font-size:18px}
.segment button.on{background:#111;color:#fff}
.urlrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;direction:ltr;align-items:stretch}
.paste{border:0;border-radius:14px;background:#111;color:#fff;padding:0 12px;font-weight:700;min-width:122px;white-space:nowrap;text-align:center;line-height:1.03}
.app-picker{border:1px solid #ddd;border-radius:14px;background:#fafafa;padding:10px}
.app-picker.hidden{display:none}
.app-picker button{width:100%;border:0;border-radius:12px;background:#222;color:#fff;padding:12px 14px;font-size:18px;font-weight:700}
.app-picker small{display:block;color:#666;margin-top:7px;font-size:13px;line-height:1.35;text-align:right}
.app-picked{margin-top:7px;font-size:14px;color:#333;word-break:break-all}

.app-picker-search{width:100%;padding:12px 13px;border:2px solid #777;border-radius:14px;font-size:18px;margin:2px 0 10px}
.app-picker-count{font-size:15px;color:#555;margin:4px 2px 8px}
.app-picker-list{display:grid;gap:7px;max-height:48dvh;overflow:auto;padding:2px 0 8px}
.app-row{display:grid;grid-template-columns:44px 1fr 34px;gap:10px;align-items:center;border:1px solid #ddd;background:#fafafa;border-radius:13px;padding:8px 10px;text-align:right}
.app-row.on{background:#eef6ff;border-color:#5d8ed5}
.app-row img{width:38px;height:38px;border-radius:9px;object-fit:contain}
.app-row .fallback{font-size:29px;text-align:center}
.app-row-name{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-row-pkg{font-size:11px;color:#777;direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-row-check{font-size:22px;text-align:center}
.app-shortcut-icon{width:34px;height:34px;border-radius:8px;object-fit:contain;display:block}

.save{width:100%;border:0;border-radius:14px;background:#111;color:#fff;padding:14px;font-size:20px;font-weight:700;margin-top:0}
.close{width:100%;border:0;border-radius:14px;background:#eee;padding:13px;font-size:18px;margin-top:8px}
.danger{background:#ffe4e8!important;color:#c7001c!important;font-weight:700}
.actionmenu{display:grid;gap:8px}
.actionmenu button{border:0;background:#f1f1f1;padding:14px 16px;font-size:19px;text-align:right;border-radius:14px}

.colors{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 14px}
.colorpick{aspect-ratio:1;border-radius:11px;border:3px solid transparent}
.colorpick.on{border-color:#111}
.iconpicks{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.iconpick{width:48px;height:48px;border:2px solid #ddd;background:#fff;border-radius:12px;font-size:25px}
.iconpick.on{border-color:#111;background:#eee}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;z-index:50;transition:.2s;white-space:nowrap}
.toast.show{opacity:1}

@media(max-width:390px){
  .grid{gap:12px;padding:12px}
  .folder{min-height:118px;padding-top:20px}
  .name{font-size:21px}
  .icon{bottom:3px}
  .sheet{max-height:78dvh;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
  .sheet h2{font-size:21px}
  .field{font-size:17px;padding:11px}
  .segment button,.close,.save,.paste,.actionmenu button{font-size:17px}
  .paste{min-width:114px}
}



/* ===== הגדרות מתקדמות ===== */
.settings-section{border-top:1px solid #ddd;padding-top:14px;margin-top:14px}
.settings-section:first-of-type{border-top:0;padding-top:0;margin-top:0}
.settings-section h3{font-size:21px;margin:8px 0 12px}
.setting-nav-row{width:100%;border:0;background:#f3f3f3;border-radius:13px;padding:13px 14px;margin:7px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:18px;text-align:right}
.setting-nav-arrow{font-size:24px;color:#666;line-height:1}
.info-grid{display:grid;grid-template-columns:1fr auto;gap:9px 14px;font-size:17px;padding:4px 0}
.manual-list{margin:8px 0 0;padding-inline-start:24px}
.manual-list li{margin:12px 0;line-height:1.45}
.manual-list b{display:block;margin-bottom:3px}
.central-type-list{border:1px solid #ddd;border-radius:16px;overflow:hidden;background:#fff}
.central-type-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 12px}
.central-type-row+.central-type-row{border-top:1px solid #eee}
.central-type-label b{display:block;font-size:16px;font-weight:600;margin-bottom:3px}
.central-type-label small{display:block;color:#777;font-size:12px;line-height:1.3}
.central-stepper{display:flex;align-items:center;gap:5px;direction:ltr}
.central-stepper button{width:38px;height:36px;border:0;border-radius:10px;background:#eee;font-size:22px;line-height:1}
.central-stepper .value{min-width:44px;height:36px;padding:0 8px;border:1px solid #ddd;border-radius:10px;background:#fafafa;display:grid;place-items:center;font-size:16px;font-weight:400}
.weight-cycle{min-width:68px!important;width:auto!important;padding:0 9px!important;font-size:15px!important;display:flex;align-items:center;justify-content:center;gap:5px}
.weight-cycle .bmark{font-size:17px;line-height:1}
.typography-help{font-size:13px;color:#666;line-height:1.5;margin:10px 2px 2px}
.color-targets{border:1px solid #ddd;border-radius:16px;overflow:hidden;background:#fff}
.color-target-row{width:100%;border:0;background:#fff;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;text-align:right}
.color-target-row+.color-target-row{border-top:1px solid #eee}
.color-target-row .radio{width:24px;height:24px;border:2px solid #777;border-radius:50%;display:grid;place-items:center}
.color-target-row.on .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:#111}
.current-swatch{width:34px;height:34px;border-radius:50%;border:2px solid #bbb;box-shadow:0 0 0 1px #fff inset}
.color-label b{display:block;font-size:16px;font-weight:600}
.color-label small{display:block;font-size:12px;color:#777;margin-top:2px;direction:ltr;text-align:right}
.color-palette{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0 10px}
.color-swatch{aspect-ratio:1;border-radius:50%;border:2px solid #bbb;min-width:0;box-shadow:0 0 0 1px #fff inset}
.color-swatch.on{outline:3px solid #111;outline-offset:2px}
.color-preview{border-radius:14px;padding:13px 15px;margin-top:10px;min-height:72px;display:flex;flex-direction:column;justify-content:center}
.color-preview .preview-title{font-size:var(--ui-header-size,28px);font-weight:var(--ui-header-weight,700);line-height:1}
.color-preview .preview-version{font-size:var(--ui-version-size,14px);font-weight:var(--ui-version-weight,400);opacity:.72;margin-top:6px}
.color-presets{margin:12px 0 14px}
.color-presets-title{font-size:16px;font-weight:600;margin:0 0 8px}
.color-presets-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.color-preset-btn{border:1px solid #d7d7d7;border-radius:12px;background:#fff;padding:9px 10px;display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center;text-align:right}
.color-preset-btn.on{outline:2px solid #111;outline-offset:1px}
.color-preset-pair{display:flex;align-items:center;gap:4px;direction:ltr}
.color-preset-dot{width:22px;height:22px;border-radius:50%;border:1px solid #bbb}
.color-preset-name{font-size:14px;font-weight:500}
.setting-toggle-row{width:100%;border:0;background:#f3f3f3;border-radius:13px;padding:13px 14px;margin:7px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:18px;text-align:right}
.switch{width:48px;height:28px;border-radius:14px;background:#bbb;position:relative;flex:0 0 auto;direction:ltr}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.switch.on{background:#111}
.switch.on::after{left:24px}
.reset-design{width:100%;border:0;border-radius:14px;background:#fff3d7;color:#6b4c00;padding:13px;font-size:18px;font-weight:700;margin-top:10px}

/* התאמות לתוכנית העצמאית */
.links{padding-bottom:18px}
.tools{padding-top:0}

/* ===== התאמת אייקון האפליקציה ===== */
.icon-settings-preview-wrap{display:flex;justify-content:center;margin:12px 0 18px}
.icon-settings-preview{width:126px;height:126px;border-radius:27px;position:relative;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.18);display:flex;align-items:flex-end;justify-content:center;padding-bottom:28px;color:#fff}
.icon-settings-preview.grid{background-image:linear-gradient(rgba(255,255,255,.58) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.58) 1px,transparent 1px);background-size:25px 25px}
.icon-settings-preview.light{background-color:#b5bbc3}.icon-settings-preview.medium{background-color:#949aa3}.icon-settings-preview.dark{background-color:#6f7680}.icon-settings-preview.sky{background-color:#a9d4e8}
.icon-preview-text{font-weight:700;text-shadow:0 2px 3px rgba(0,0,0,.25);direction:rtl;white-space:nowrap}
.icon-preview-text.small{font-size:30px}.icon-preview-text.normal{font-size:37px}.icon-preview-text.large{font-size:44px}
.icon-choice-group{margin:15px 0}.icon-choice-title{font-size:17px;font-weight:650;margin-bottom:8px}
.icon-choice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.icon-choice-row.two{grid-template-columns:repeat(2,1fr)}
.icon-choice{border:1px solid #c9c9c9;border-radius:13px;background:#f7f7f7;padding:11px 6px;font-size:16px}
.icon-choice.on{border:2px solid #526b8d;background:#eef4fb;font-weight:650}
.icon-note{font-size:14px;color:#555;line-height:1.5;margin:12px 0}

</style>
</head>

function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function jsq(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function numPrefix(text){const m=String(text||'').trim().match(/^(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):Infinity;}
function compareNumbered(a,b,key){
  const av=String(a?.[key]||''), bv=String(b?.[key]||'');
  const an=numPrefix(av), bn=numPrefix(bv);
  if(an!==bn) return an-bn;
  return av.localeCompare(bv,'he',{numeric:true,sensitivity:'base'});
}
function uid(prefix){return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);}
function canonicalFolder(){return {id:STOCKS_ID,name:APP_NAME,color:'#FFD86E',icon:'😀',createdAt:1};}

function normalizeFontWeight(v,fallback=400){
  const n=Number(v);return FONT_WEIGHTS.includes(n)?n:fallback;
}
function nextFontWeight(v){
  const i=FONT_WEIGHTS.indexOf(normalizeFontWeight(v,400));return FONT_WEIGHTS[(i+1)%FONT_WEIGHTS.length];
}
function normalizeHexColor(v,fallback){
  const s=String(v||'').trim().toLowerCase();return /^#[0-9a-f]{6}$/.test(s)?s:fallback;
}
function normalizeUiTypography(v){
  const d=UI_TYPO_DEFAULT;
  const val=(key,min,max)=>{const n=Number(v?.[key]);return Number.isFinite(n)?Math.max(min,Math.min(max,Math.round(n))):d[key];};
  return {
    headerSize:val('headerSize',14,36),versionSize:val('versionSize',10,24),shortcutSize:val('shortcutSize',12,30),urlSize:val('urlSize',10,22),toolSize:val('toolSize',12,26),
    headerWeight:normalizeFontWeight(v?.headerWeight,d.headerWeight),versionWeight:normalizeFontWeight(v?.versionWeight,d.versionWeight),shortcutWeight:normalizeFontWeight(v?.shortcutWeight,d.shortcutWeight),urlWeight:normalizeFontWeight(v?.urlWeight,d.urlWeight),toolWeight:normalizeFontWeight(v?.toolWeight,d.toolWeight)
  };
}
function normalizeUiColors(v){
  return {headerBg:normalizeHexColor(v?.headerBg,UI_COLOR_DEFAULT.headerBg),headerText:normalizeHexColor(v?.headerText,UI_COLOR_DEFAULT.headerText),pageBg:normalizeHexColor(v?.pageBg,UI_COLOR_DEFAULT.pageBg),cardBg:normalizeHexColor(v?.cardBg,UI_COLOR_DEFAULT.cardBg)};
}
function normalizeUiPrefs(v){return {showUrl:v?.showUrl!==false};}
function uiTypography(){DATA.uiTypography=normalizeUiTypography(DATA.uiTypography);return DATA.uiTypography;}
function uiColors(){DATA.uiColors=normalizeUiColors(DATA.uiColors);return DATA.uiColors;}
function uiPrefs(){DATA.uiPrefs=normalizeUiPrefs(DATA.uiPrefs);return DATA.uiPrefs;}
function applyUiSettings(){
  const t=uiTypography(),c=uiColors();
  const r=document.documentElement.style;
  r.setProperty('--ui-header-size',t.headerSize+'px');r.setProperty('--ui-version-size',t.versionSize+'px');r.setProperty('--ui-shortcut-size',t.shortcutSize+'px');r.setProperty('--ui-url-size',t.urlSize+'px');r.setProperty('--ui-tool-size',t.toolSize+'px');
  r.setProperty('--ui-header-weight',String(t.headerWeight));r.setProperty('--ui-version-weight',String(t.versionWeight));r.setProperty('--ui-shortcut-weight',String(t.shortcutWeight));r.setProperty('--ui-url-weight',String(t.urlWeight));r.setProperty('--ui-tool-weight',String(t.toolWeight));
  r.setProperty('--ui-header-bg',c.headerBg);r.setProperty('--ui-header-text',c.headerText);r.setProperty('--ui-page-bg',c.pageBg);r.setProperty('--ui-card-bg',c.cardBg);
  const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',c.headerBg);
}
function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(DATA));}
function loadLocal(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const x=JSON.parse(raw);
      if(Array.isArray(x.links)){
        DATA={folders:[canonicalFolder()],links:x.links.map(l=>({...l,folderId:STOCKS_ID})),lastBackup:x.lastBackup||'',uiTypography:normalizeUiTypography(x.uiTypography),uiColors:normalizeUiColors(x.uiColors),uiPrefs:normalizeUiPrefs(x.uiPrefs)};
        applyUiSettings();return;
      }
    }
  }catch(e){}
  DATA={folders:[canonicalFolder()],links:structuredClone(SEED.links),lastBackup:'',uiTypography:{...UI_TYPO_DEFAULT},uiColors:{...UI_COLOR_DEFAULT},uiPrefs:{...UI_PREFS_DEFAULT}};
  applyUiSettings();saveLocal();
}

function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('show');
  clearTimeout(t.x);t.x=setTimeout(()=>t.classList.remove('show'),2200);
}
function sortedLinks(){return DATA.links.slice().sort((a,b)=>compareNumbered(a,b,'title'));}
function findLink(id){return DATA.links.find(l=>String(l.id)===String(id))||null;}

function appHeader(){
  return `<div class="head">
    <div class="head-title"><h1>${APP_NAME}</h1><div class="version">גרסה מס' ${APP_VERSION}</div></div>
    <div class="icons">
      <button class="addtop" onclick="openNewLink()" aria-label="הוסף קישור">
        <span class="plus-left">+</span><span class="symbol-right">🔗</span>
      </button>
    </div>
  </div>`;
}

function isAppShortcut(l){return !!(l && l.shortcutType === 'app');}
function globeSvg(kind){
  return '<svg class="link-globe '+kind+'" viewBox="0 0 32 32" aria-hidden="true">'+
    '<circle cx="16" cy="16" r="12"></circle>'+ '<path d="M4 16h24"></path>'+ '<path d="M16 4c4 4 6 8 6 12s-2 8-6 12"></path>'+ '<path d="M16 4c-4 4-6 8-6 12s2 8 6 12"></path>'+ '</svg>';
}
function linkMarker(l){
  if(l && l.shortcutType==='app'){
    if(l.appIcon)return '<img class="app-shortcut-icon" src="'+esc(l.appIcon)+'" alt="">';
    return '<span class="missing-mark">📱</span>';
  }
  if(!l || !l.url) return '<span class="missing-mark">✏️</span>';
  return globeSvg('website');
}

function renderApp(){
  currentFolder=STOCKS_ID;
  const ls=sortedLinks();
  let html=appHeader();
  if(!ls.length) html+='<div class="empty">עדיין אין קישורים.</div>';
  else{
    html+='<main class="links">';
    for(const l of ls){
      html+=`<div class="link"
        onclick="tapLink('${jsq(l.id)}')"
        ontouchstart="lpStart(event,'${jsq(l.id)}')" ontouchmove="lpMove(event)"
        ontouchend="lpEnd()" ontouchcancel="lpCancel()"
        onmousedown="mouseLpStart(event,'${jsq(l.id)}')" onmouseup="mouseLpEnd()"
        onmouseleave="mouseLpEnd()" oncontextmenu="return false">
        <div class="li">${linkMarker(l)}</div>
        <div class="lt"><b>${esc(l.title)}</b>
        ${isAppShortcut(l)?('<small>'+esc(l.packageName||'אפליקציה')+'</small>'):(l.url?(uiPrefs().showUrl?'<small>'+esc(l.url)+'</small>':''):'<small class="missing">כתובת להשלמה</small>')}</div>
      </div>`;
    }
    html+='</main>';
  }
  html+=`<div class="tools">
    <button class="toolbtn" onclick="openBackupMenu()">💾 גיבוי</button>
    <button class="toolbtn" onclick="chooseRestore()">שחזור</button>
    <button class="toolbtn" onclick="openSettings()">הגדרות</button>
  </div>
  <div class="backup-date">${DATA.lastBackup?'גיבוי אחרון: '+esc(DATA.lastBackup):'עדיין לא נוצר גיבוי'}</div>`;
  document.getElementById('app').innerHTML=html;
}

  return `<h2>הגדרות</h2>

function commitPendingLauncherIcon(){

      launcherIconCommitStarted=true;

function wireOverlayFocus(){
  const sheet=document.querySelector('#ov .sheet');
  if(!sheet)return;
  const inputs=sheet.querySelectorAll('input, textarea');
  inputs.forEach(el=>el.addEventListener('focus',()=>{
    setTimeout(()=>{try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}},220);
  }));
  const first=sheet.querySelector('input[autofocus], textarea[autofocus]');
  if(first){setTimeout(()=>{try{first.focus({preventScroll:true});}catch(e){first.focus();}},80);}
}
function openOverlayHtml(inner,state={view:'overlay'},hash='#overlay',isForm=false){

  d.innerHTML='<div class="sheet'+(isForm?' form-sheet':'')+'">'+inner+'</div>';
  d.onclick=e=>{if(e.target===d) closeOverlay();};
  document.body.appendChild(d);
  wireOverlayFocus();
  history.pushState(state,'',hash);
}
function replaceOverlayHtml(inner,isForm=false){
  removeOverlay();
  const d=document.createElement('div');d.id='ov';d.className='overlay';
  d.innerHTML='<div class="sheet'+(isForm?' form-sheet':'')+'">'+inner+'</div>';

  selectedAppPackages=new Set();
  replaceOverlayHtml(`<h2>בחר אפליקציות</h2>
    <input id="appSearch" class="app-picker-search" placeholder="חיפוש אפליקציה" oninput="renderInstalledAppsRows()">
    <div id="appPickerCount" class="app-picker-count">לא נבחרו אפליקציות</div>
    <div id="appRows" class="app-picker-list"></div>
    <div class="sticky-actions"><button class="save" onclick="addSelectedInstalledApps()">הוסף לתיק</button><button class="close" onclick="openNewLink()">חזרה</button></div>`,true);
  renderInstalledAppsRows();
}
function renderInstalledAppsRows(){
  const host=document.getElementById('appRows');if(!host)return;
  const q=(document.getElementById('appSearch')?.value||'').trim().toLowerCase();
  const rows=installedAppsCache.filter(a=>!q||String(a.name||'').toLowerCase().includes(q)||String(a.packageName||'').toLowerCase().includes(q));
  host.innerHTML=rows.length?rows.map(a=>{const pkg=String(a.packageName||'');const on=selectedAppPackages.has(pkg);return `<button class="app-row ${on?'on':''}" onclick="toggleInstalledApp('${jsq(pkg)}')">${a.icon?`<img src="${esc(a.icon)}" alt="">`:'<span class="fallback">📱</span>'}<span><div class="app-row-name">${esc(a.name||pkg)}</div><div class="app-row-pkg">${esc(pkg)}</div></span><span class="app-row-check">${on?'✓':'○'}</span></button>`;}).join(''):'<div class="empty" style="padding:16px">אין תוצאות</div>';
  updateInstalledAppsCount();
}
function toggleInstalledApp(pkg){if(selectedAppPackages.has(pkg))selectedAppPackages.delete(pkg);else selectedAppPackages.add(pkg);renderInstalledAppsRows();}
function updateInstalledAppsCount(){const el=document.getElementById('appPickerCount');if(el)el.textContent=selectedAppPackages.size?'נבחרו '+selectedAppPackages.size+' אפליקציות':'לא נבחרו אפליקציות';}
function addSelectedInstalledApps(){
  if(!selectedAppPackages.size)return toast('בחר לפחות אפליקציה אחת');
  const now=Date.now();let added=0;
  for(const a of installedAppsCache){
    const pkg=String(a.packageName||'');if(!selectedAppPackages.has(pkg))continue;
    if(DATA.links.some(l=>String(l.packageName||'')===pkg))continue;
    DATA.links.push({id:uid('l'),folderId:STOCKS_ID,title:String(a.name||pkg),url:'',shortcutType:'app',packageName:pkg,appIcon:String(a.icon||''),tag:'',createdAt:now+added,updatedAt:now+added});added++;
  }
  if(!added)return toast('האפליקציות שנבחרו כבר קיימות');
  saveLocal();toast(added===1?'האפליקציה נוספה':'האפליקציות נוספו');closeOverlay();
}

function openEdit(id,replaceCurrent){
  const l=findLink(id);if(!l)return;editId=String(id);editType=l.shortcutType||'website';
  const appNative=editType==='app'&&l.packageName;
  const x=`<h2>עריכת קיצור דרך</h2>
    <div class="form-stack">
      <div class="segment"><button id="webBtn" class="${editType==='website'?'on':''}" onclick="setType('website')">אתר</button><button id="appBtn" class="${editType==='app'?'on':''}" onclick="setType('app')">אפליקציה</button></div>
      <input id="editTitle" class="field" value="${esc(l.title)}" placeholder="שם הקישור" autofocus>
      ${appNative?`<div class="field" style="background:#f3f3f3;direction:ltr">${esc(l.packageName)}</div>`:`<div class="urlrow"><input id="editUrl" class="field" dir="ltr" value="${esc(l.url||'')}" placeholder="https://..."><button class="paste" onclick="pasteUrl()">הדבק URL</button></div>`}
    </div>
    <div class="sticky-actions"><button class="save" onclick="saveEdit()">שמור</button><button class="close" onclick="closeOverlay()">ביטול</button><button class="close danger" onclick="deleteEditingLink()">מחיקת קיצור דרך</button></div>`;
  replaceCurrent&&document.getElementById('ov')?replaceOverlayHtml(x,true):openOverlayHtml(x,{view:'overlay'},'#overlay',true);
}
function setType(x){editType=x;document.getElementById('webBtn')?.classList.toggle('on',x==='website');document.getElementById('appBtn')?.classList.toggle('on',x==='app');}
async function pasteUrl(){
  const input=document.getElementById('editUrl');
  if(!input)return;
  input.focus();

  const putText=(value)=>{
    const text=String(value||'').trim();
    if(!text)return false;
    input.value=text;
    input.dispatchEvent(new Event('input',{bubbles:true}));
    input.dispatchEvent(new Event('change',{bubbles:true}));
    toast('הכתובת הודבקה');
    return true;
  };

  /* בגרסת APK נוכל לקבל את הלוח ישירות מגשר Android, אם הוא קיים. */
  try{
    if(window.AndroidClipboard?.getText && putText(window.AndroidClipboard.getText()))return;
    if(window.Android?.getClipboardText && putText(window.Android.getClipboardText()))return;
  }catch(e){}

  /* הדרך הרגילה בדפדפן/HTML מקומי. */
  try{
    if(navigator.clipboard?.readText){
      const text=await navigator.clipboard.readText();
      if(putText(text))return;
    }
  }catch(e){}

  /* גיבוי לדפדפנים שמאפשרים paste באמצעות פקודה ישנה. */
  try{
    let pasted='';
    const onPaste=(ev)=>{
      pasted=(ev.clipboardData||window.clipboardData)?.getData('text')||'';
      if(pasted){ev.preventDefault();putText(pasted);}
    };
    input.addEventListener('paste',onPaste,{once:true});
    const ok=document.execCommand && document.execCommand('paste');
    if(ok && (pasted||input.value))return;
    input.removeEventListener('paste',onPaste);
  }catch(e){}

  input.focus();
  toast('הדפדפן חסם קריאת לוח. ב-APK ההדבקה תפעל ישירות');
}
function saveNewLinkFromForm(){
  const title=document.getElementById('editTitle')?.value.trim()||'';
  let url=document.getElementById('editUrl')?.value.trim()||'';
  if(!title)return toast('נא להקליד שם לקישור');
  if(url&&editType==='website'&&!/^https?:\/\//i.test(url))url='https://'+url;
  DATA.links.push({id:uid('l'),folderId:STOCKS_ID,title,url,shortcutType:editType,tag:'',createdAt:Date.now(),updatedAt:Date.now()});
  saveLocal();toast('קיצור הדרך נוסף');closeOverlay();
}
function saveEdit(){
  const l=findLink(editId);if(!l)return;
  const title=document.getElementById('editTitle')?.value.trim()||'';
  let url=document.getElementById('editUrl')?.value.trim()||l.url||'';
  if(!title)return toast('נא להקליד שם');
  if(url&&editType==='website'&&!/^https?:\/\//i.test(url))url='https://'+url;
  l.title=title;l.url=url;l.shortcutType=editType;l.updatedAt=Date.now();
  if(editType==='website'){delete l.packageName;delete l.appIcon;}
  saveLocal();toast('השינוי נשמר');closeOverlay();
}
function deleteEditingLink(){
  const l=findLink(editId);if(!l)return;
  if(!confirm('למחוק את קיצור הדרך "'+l.title+'"?'))return;
  const id=String(editId);DATA.links=DATA.links.filter(x=>String(x.id)!==id);editId=null;
  saveLocal();toast('קיצור הדרך נמחק');closeOverlay();
}

function openShortcut(id){
  const l=findLink(id);if(!l)return;
  if(l.shortcutType==='app'&&l.packageName){
    try{if(window.AndroidApps&&AndroidApps.launchApp){AndroidApps.launchApp(String(l.packageName));return;}}catch(e){}
  }
  if(!l.url)return openEdit(id,false);
  if(l.shortcutType==='app'&&String(l.url).startsWith('app:')){
    const pkg=String(l.url).slice(4).trim();
    if(pkg&&window.AndroidApps?.openPackage){
      try{if(window.AndroidApps.openPackage(pkg))return;}catch(e){}
    }
    toast('לא ניתן לפתוח את האפליקציה');
    return;
  }
  const isAndroid=/Android/i.test(navigator.userAgent||'');
  const isPlay=/play\.google\.com\/store\/apps\/details/i.test(l.url||'');
  if(isAndroid&&(l.shortcutType==='app'||isPlay)){
    const p=extractPlayPackage(l.url);
    if(p){location.href='intent://#Intent;package='+p+';action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;S.browser_fallback_url='+encodeURIComponent(l.url)+';end';return;}
  }
  location.href=l.url;
}
function extractPlayPackage(url){
  try{const u=new URL(url);return u.hostname.includes('play.google.com')?(u.searchParams.get('id')||''):'';}
  catch(e){const m=String(url||'').match(/[?&]id=([^&]+)/);return m?decodeURIComponent(m[1]):'';}
}

function pad(n){return String(n).padStart(2,'0');}
function stamp(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+'-'+pad(d.getMinutes());}
function displayStamp(){const d=new Date();return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function backupPayload(){
  return {app:'ב.לאומי',version:1,appVersion:APP_VERSION,createdAt:new Date().toISOString(),folders:[canonicalFolder()],links:DATA.links,uiTypography:uiTypography(),uiColors:uiColors(),uiPrefs:uiPrefs(),launcherIcon:readLauncherIconSettings()};
}
function openBackupMenu(){
  backupSettingsOpen=false;
  openOverlayHtml(`<h2>גיבוי ושחזור</h2><div class="form-stack"><button class="setting-nav-row" onclick="downloadBackup()">גיבוי נתונים</button><button class="setting-nav-row" onclick="AndroidBackup.backupApk()">גיבוי תוכנית (APK)</button><button class="setting-nav-row" onclick="chooseRestore()">שחזור מקובץ</button><button class="setting-nav-row" onclick="openBackupSettings()">הגדרות גיבוי</button><button class="setting-nav-row" onclick="AndroidBackup.exportData(JSON.stringify(backupPayload(),null,2))">עותק נתונים ל־Google Drive</button><button class="setting-nav-row" onclick="AndroidBackup.exportApk()">עותק APK ל־Google Drive</button></div><p class="icon-note">גיבוי נתונים יוצר קובץ חדש עם תאריך ושעה. גיבוי APK שומר עותק אחד לכל גרסה, בטלפון ובתיקיית הענן שנבחרה.</p><p>${DATA.lastBackup?'גיבוי אחרון: '+esc(DATA.lastBackup):'עדיין לא נוצר גיבוי'}</p><button class="close" onclick="closeOverlay()">סגור</button>`,{view:'overlay'},'#backup');
}
function backupSettingsHtml(){const x=JSON.parse(AndroidBackup.status());return `<h2>הגדרות גיבוי</h2><p>שמירה בטלפון: Download/גיבויים/ב.לאומי</p><p>${x.cloud?'נבחרה תיקיית ענן. ההרשאה נשמרת להמשך.':'טרם נבחרה תיקיית ענן.'}</p><p class="icon-note">בחר תיקייה ב־Google Drive, למשל „גיבויים מהטלפון”. בתוכה תיווצר תיקיית ב.לאומי. ניתן לבחור גם ספק קבצים אחר שמאפשר שמירה בתיקייה. אם Google Drive לא מופיע בבחירת תיקייה, השתמש בכפתור „עותק ל־Google Drive” בתפריט הגיבוי.</p><button class="setting-nav-row" onclick="AndroidBackup.configureCloud()">${x.cloud?'שינוי תיקיית הענן':'בחירת תיקיית ענן'}</button>${x.cloud?'<button class="setting-nav-row" onclick="disconnectBackupCloud()">ניתוק תיקיית הענן</button>':''}<button class="close" onclick="openBackupMenu()">חזרה</button>`;}
let backupSettingsOpen=false;
function openBackupSettings(){backupSettingsOpen=true;replaceOverlayHtml(backupSettingsHtml());}
function refreshBackupSettings(){if(backupSettingsOpen&&document.getElementById('ov'))replaceOverlayHtml(backupSettingsHtml());}
function disconnectBackupCloud(){AndroidBackup.disconnectCloud();refreshBackupSettings();}
function downloadBackup(){
  if(window.AndroidBackup){AndroidBackup.backupData(JSON.stringify(backupPayload(),null,2));return;}
  toast('הגיבוי זמין באפליקציית ב.לאומי');
}
function backupCompleted(){DATA.lastBackup=displayStamp();saveLocal();renderApp();}
function extractStocksFromBackup(obj){
  if(!obj||typeof obj!=='object'||!Array.isArray(obj.links))throw Error('קובץ לא מתאים');
  let links;
  if(obj.app==='ב.לאומי')links=obj.links;
  else if(obj.app==='בנקים' && Array.isArray(obj.folders) && obj.folders.some(f=>String(f.id)===STOCKS_ID)) {
    // The old BTL release accidentally labeled its own backup as banks.
    links=obj.links.filter(l=>String(l.folderId)===STOCKS_ID);
  }
  else {
    if(obj.app && !['תיקיות 1','תיקיות 2','תיקיות 3','תיקיות','Tikiyot'].includes(obj.app))throw Error('זהו גיבוי של תוכנית אחרת');
    const f=Array.isArray(obj.folders)?obj.folders.find(x=>String(x.id)===STOCKS_ID)||obj.folders.find(x=>/^\s*(?:[\d.]+\s*[-–]?\s*)?ב\.לאומי\s*$/.test(String(x.name||''))):null;
    if(f)links=obj.links.filter(l=>String(l.folderId)===String(f.id));
    else if(!obj.app && obj.links.length && obj.links.every(l=>String(l.folderId)===STOCKS_ID))links=obj.links;
    else throw Error('לא נמצאה תיקיית ב.לאומי');
  }
  const ids=new Set();
  const clean=links.map((l,i)=>{
    if(!l||typeof l!=='object'||typeof l.title!=='string'||l.title.length>2000)throw Error('פריט לא תקין בגיבוי');
    if(l.shortcutType && !['app','website'].includes(l.shortcutType))throw Error('סוג קיצור לא תקין');
    const type=l.shortcutType||'website';
    if(type==='app'&&(!l.packageName||!/^[a-zA-Z][\w]*(?:\.[\w]+)+$/.test(l.packageName)))throw Error('מזהה אפליקציה לא תקין');
    if(l.url && !/^(https?:|intent:|market:|tel:|mailto:)/i.test(l.url))throw Error('כתובת קישור לא תקינה');
    let id=String(l.id||'restored_'+i);if(ids.has(id))id+='_'+i;ids.add(id);
    return {...l,id,folderId:STOCKS_ID,shortcutType:type,appIcon:typeof l.appIcon==='string'&&/^data:image\/(png|jpeg|webp);base64,/.test(l.appIcon)?l.appIcon:''};
  });
  return {links:clean,uiTypography:obj.uiTypography,uiColors:obj.uiColors,uiPrefs:obj.uiPrefs,launcherIcon:obj.launcherIcon};
}
function chooseRestore(){document.getElementById('restoreInput').click();}
document.getElementById('restoreInput').addEventListener('change',async function(){
  const file=this.files?.[0];this.value='';if(!file)return;
  try{
    if(file.size>25*1024*1024)throw Error('הקובץ גדול מדי');
    const obj=JSON.parse(await file.text()), restored=extractStocksFromBackup(obj);
    const date=obj.createdAt?new Date(obj.createdAt).toLocaleString('he-IL'):'לא צוין';
    if(!confirm('לשחזר את הגיבוי?\nתאריך: '+date+'\nגרסה: '+(obj.appVersion||obj.version||'לא צוינה')+'\nמספר קיצורים: '+restored.links.length+'\nהנתונים הקיימים יוחלפו.'))return;
    const next={folders:[canonicalFolder()],links:restored.links,lastBackup:DATA.lastBackup||'',uiTypography:normalizeUiTypography(restored.uiTypography||DATA.uiTypography),uiColors:normalizeUiColors(restored.uiColors||DATA.uiColors),uiPrefs:normalizeUiPrefs(restored.uiPrefs||DATA.uiPrefs)};
    // Persist before replacing the visible state. A failed write preserves old data.
    localStorage.setItem(STORAGE_KEY,JSON.stringify(next));DATA=next;
    if(restored.launcherIcon){launcherIconSettings=normalizeLauncherIconObject(restored.launcherIcon);localStorage.setItem(ICON_PENDING_KEY,JSON.stringify(launcherIconSettings));AndroidIcon.setStyle(JSON.stringify(launcherIconSettings));}
    applyUiSettings();renderApp();if(document.getElementById('ov'))closeOverlay();toast('השחזור הושלם');
  }catch(e){toast('השחזור לא בוצע: '+e.message);}
});

function applyLauncherIconSettings(){
  launcherIconSettings=normalizeLauncherIconObject(launcherIconSettings);
  localStorage.setItem(ICON_PENDING_KEY,JSON.stringify(launcherIconSettings));
  AndroidIcon.setStyle(JSON.stringify(launcherIconSettings));
  replaceOverlayHtml(iconSettingsHtml());toast('האייקון יתעדכן ביציאה מהתוכנית');
}
function commitPendingLauncherIcon(){const p=pendingLauncherIconSettings();if(p&&window.AndroidIcon){AndroidIcon.setStyle(JSON.stringify(p));localStorage.removeItem(ICON_PENDING_KEY);}}
function ensureDefaultLauncherIcon(){}
loadLocal();
applyUiSettings();
ensureDefaultLauncherIcon();
initHistory();
renderApp();
</script>
