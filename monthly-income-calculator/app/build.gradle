plugins {
    id 'com.android.application'
}

android {
    namespace 'com.militzerjoseph.monthlyincome2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.militzerjoseph.monthlyincome2'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
